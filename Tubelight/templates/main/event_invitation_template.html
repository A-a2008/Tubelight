{% load static %}
<!DOCTYPE HTML>
<html>
	<head>
		<title>Tubelight</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{% static 'assets/css/main.css' %}" />
		<noscript><link rel="stylesheet" href="{% static 'assets/css/noscript.css' %}" /></noscript>
		<link rel="icon" href="{% static 'images/logo-bgremoved-small.png' %}">
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header" class="alt">
						<span class="logo"><img src="{% static 'images/logo-bgremoved-small-white.png' %}" alt="" /></span>
						<h1>Tubelight</h1>
						<p>Manage your event gatherings with ease and efficiency<br /><br>
						</p>
					</header>


				<!-- Main -->
					<div id="main">

						<!-- Introduction -->
							<section class="main">
								<div class="spotlight" id="intro">
									<div class="content">
										<header class="major">
											<h2>You are Invited!</h2>
										</header>
                                        <br>
                                        <h2><b>{{ template_name }}:</b>  {{ event_name }}</h2>
                                        {% for key, value in event.items %}
                                        <p><strong>{{ key }}:</strong> {{ value }}</p>
                                        {% endfor %}
									</div>
								</div>
							</section>

                            
				<!-- Footer -->
					<footer id="footer">
						
					</footer>

			</div>

		<!-- Scripts -->
			<script src="{% static 'assets/js/jquery.min.js' %}"></script>
			<script src="{% static 'assets/js/jquery.scrollex.min.js' %}"></script>
			<script src="{% static 'assets/js/jquery.scrolly.min.js' %}"></script>
			<script src="{% static 'assets/js/browser.min.js' %}"></script>
			<script src="{% static 'assets/js/breakpoints.min.js' %}"></script>
			<script src="{% static 'assets/js/util.js' %}"></script>
			<script src="{% static 'assets/js/main.js' %}"></script>

	</body>
</html>
